[workspace]
resolver = "2"
members = [
    "crates/rootmode-core",
    "crates/rootmode-p2p",
    "crates/rootmode-worker",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.11"
edition = "2021"
license = "MIT"
repository = "https://github.com/rootmodeai/rootmode"

# For the daemons. They wait on sockets; they do not need `-O3` and LTO, and
# paying for those turns a VPS deploy into a coffee break — or an OOM kill.
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
debug = false
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
rand = "0.8"
