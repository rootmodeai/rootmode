[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]
# Implementations are Vyper 0.4.3 (`vyper` on PATH). Tests and the local
# deploy script stay in Solidity and talk to them through src/interfaces.sol.

[rpc_endpoints]
base = "${BASE_RPC_URL}"

