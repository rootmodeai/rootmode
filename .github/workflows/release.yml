# Cut a desktop release: tag vX.Y.Z and this builds, signs, notarizes (macOS),
# and publishes installers to GitHub Releases. The site's /download button
# points at the stable asset names uploaded here.
#
#   git tag v0.1.0 && git push origin v0.1.0
#   gh release create v0.1.0 --title "rootmode v0.1.0" --notes "Installers for this tag." --verify-tag
#
# The release itself is created by whoever tags (an admin bypasses the
# "release tags" ruleset); the workflow token cannot create one — tag
# rulesets gate release creation and GitHub Actions is not a bypass
# actor. The jobs here only upload assets into the existing release.
#
# Apple secrets (macOS jobs only; the job fails without them, because an
# unstapled disk image is rejected by Gatekeeper and the download never opens):
#   APPLE_CERTIFICATE            base64 of Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   .p12 export password
#   APPLE_SIGNING_IDENTITY       "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                     Apple ID email
#   APPLE_PASSWORD               app-specific password
#   APPLE_TEAM_ID                10-character team id
#
# tauri-action notarizes the .app. Gatekeeper, on a file a browser
# downloaded, checks the .dmg. This workflow submits that image too and
# staples the ticket onto it before the stable filename is published.
#
# To repair a release that is already out, without rebuilding:
#   gh workflow run release.yml -f repair_tag=v0.1.25
#
# Repo Settings → Actions → Workflow permissions → Read and write.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repair_tag:
        description: "Release whose disk images should be notarized and re-uploaded, e.g. v0.1.25. Empty rebuilds nothing."
        required: false
        type: string

permissions:
  contents: write

jobs:
  # A browser-downloaded disk image is checked on its own. A notarized app
  # inside an unnotarized image does not open. Submit the image, staple the
  # ticket to it, and refuse to publish if that did not stick.
  repair-dmg:
    if: github.event_name == 'workflow_dispatch' && inputs.repair_tag != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notarize the disk images already on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REPAIR_TAG: ${{ inputs.repair_tag }}
        run: bash .github/workflows/staple-dmg.sh --tag "$REPAIR_TAG"

  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            stable: rootmode-macos-arm64.dmg
            glob: "*aarch64*.dmg"
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
            stable: rootmode-macos-x64.dmg
            glob: "*x64*.dmg"
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
            stable: rootmode-linux-x86_64.AppImage
            glob: "*.AppImage"
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --bundles msi
            stable: rootmode-windows-x64.msi
            glob: "*.msi"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Linux WebKit
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            gstreamer1.0-alsa gstreamer1.0-pulseaudio gstreamer1.0-gl

      - name: Frontend
        working-directory: apps/desktop
        run: npm ci

      - name: Build, sign, notarize, upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ROOTMODE_STRIPE_SECRET_KEY: ${{ secrets.ROOTMODE_STRIPE_SECRET_KEY }}
          ROOTMODE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.ROOTMODE_STRIPE_PUBLISHABLE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: rootmode ${{ github.ref_name }}
          releaseBody: Installers for this tag. The site Download button uses the stable filenames (rootmode-macos-arm64.dmg, rootmode-windows-x64.msi, rootmode-linux-x86_64.AppImage).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Notarize the disk image
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/workflows/staple-dmg.sh --built '${{ matrix.glob }}'

      - name: Stable filename on the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # tauri-action uploaded a versioned name; upload the same file we
          # just built under the stable name the site Download button uses.
          # From the local bundle, not downloaded back from the release: every
          # download counts on GitHub's public counter, and this step alone
          # was ~6 phantom "downloads" per release.
          src=$(find target -type f -path '*/bundle/*' -name '${{ matrix.glob }}' | head -1)
          if [ -z "$src" ]; then
            echo "no ${{ matrix.glob }} under target/"
            find target -type d -name bundle
            exit 1
          fi
          cp "$src" "${{ matrix.stable }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.stable }}" --clobber
          echo "uploaded ${{ matrix.stable }} from $src"
